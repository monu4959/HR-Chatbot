# Continuous delivery: every commit on main that passes CI is built into a Docker image and published to
# GitHub Container Registry as ghcr.io/<owner>/hr-chatbot, tagged with its commit SHA and "latest".
# Nothing that failed CI is ever published. Run it with docker-compose.yml.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # republish the current main by hand

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    name: Build and publish Docker image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # build exactly the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name (registry paths must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hr-chatbot" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.title=HR-Chatbot
            org.opencontainers.image.description=Recognition analytics agent (LangGraph, FastAPI, Streamlit)

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          image="${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha || github.sha }}"
          docker run -d --name smoke -p 8000:8000 "$image"
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ && break; sleep 3; done
          curl -sf http://localhost:8000/dataset/summary | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['total_rows'] == 1000, d; print('dataset summary ok:', d['total_rows'], 'rows')"
          docker rm -f smoke
