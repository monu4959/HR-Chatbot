# Runs the published image: API on http://localhost:8000, UI on http://localhost:8501.
# The app's model runs in Ollama on the host machine (ollama pull qwen2.5:7b first).
#
#   docker compose up            # uses ghcr.io/monu4959/hr-chatbot:latest
#   docker compose up --build    # builds from this checkout instead
#
# Optional settings (LangSmith keys, a different provider, ...) are read from .env if it exists.

services:
  api:
    image: ghcr.io/monu4959/hr-chatbot:latest
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside a container "localhost" is the container itself; Ollama runs on the host. (A separate variable
      # name on purpose: compose also reads .env for ${...}, and .env's OLLAMA_BASE_URL is localhost.)
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes host.docker.internal work on Linux too

  ui:
    image: ghcr.io/monu4959/hr-chatbot:latest
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0",
              "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    healthcheck:   # the image's default check probes the API port; the UI serves 8501
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
